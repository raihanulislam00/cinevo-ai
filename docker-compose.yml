services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinevo
      POSTGRES_PASSWORD: cinevo
      POSTGRES_DB: cinevo
    ports:
      - "5432:5432"
    volumes:
      - cinevo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinevo -d cinevo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cinevo:cinevo@postgres:5432/cinevo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:3000
      STORAGE_LOCAL_PATH: /app/storage
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    ports:
      - "9000:9000"
    volumes:
      - cinevo-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:9000/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:9000
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cinevo-postgres:
  cinevo-storage: