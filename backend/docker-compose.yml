services:
  backend:
    build: .
    ports:
      - '9000:9000'
    env_file: .env
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinevo
      POSTGRES_PASSWORD: cinevo
      POSTGRES_DB: cinevo
    ports: ['5432:5432']
    volumes: [cinevo-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  cinevo-postgres:
